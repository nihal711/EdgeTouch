name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash build/Release/EdgeTouch.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  EdgeTouch.exe" | Out-File -Encoding ascii build/Release/EdgeTouch.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeTouch
          path: |
            build/Release/EdgeTouch.exe
            build/Release/EdgeTouch.exe.sha256

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Release/EdgeTouch.exe
            build/Release/EdgeTouch.exe.sha256
